<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo — HYDROFLASKER</title>
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/catalog.css" />
</head>
<body>
  <div id="app-header"></div>

  <div class="catalog-layout">

    <!-- ── Sidebar ── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__header">
        <h2 class="sidebar__title">Filtros</h2>
        <p class="sidebar__sub">Filtrar por estilo de aventura</p>
      </div>

      <nav class="sidebar__nav">
        <a href="?brand=all" class="sidebar__navlink sidebar__navlink--active" data-brand="all">
          <span class="material-symbols-outlined">water_drop</span>
          Todas las Botellas
        </a>
        <a href="?brand=stanley" class="sidebar__navlink" data-brand="stanley">
          <span class="material-symbols-outlined">verified</span>
          Stanley
        </a>
        <a href="?brand=yeti" class="sidebar__navlink" data-brand="yeti">
          <span class="material-symbols-outlined">workspace_premium</span>
          Yeti
        </a>
        <a href="?brand=hydroflask" class="sidebar__navlink" data-brand="hydroflask">
          <span class="material-symbols-outlined">eco</span>
          Hydro Flask
        </a>
        <a href="?brand=owala" class="sidebar__navlink" data-brand="owala">
          <span class="material-symbols-outlined">grid_view</span>
          Owala
        </a>
      </nav>

      <div class="sidebar__section">
        <h3 class="sidebar__section-title">Tamaño</h3>
        <div class="sidebar__checkgroup">
          <label class="sidebar__check"><input type="checkbox" value="20" id="sz-20" /><span>20 oz</span></label>
          <label class="sidebar__check"><input type="checkbox" value="30" id="sz-30" checked /><span>30 oz</span></label>
          <label class="sidebar__check"><input type="checkbox" value="40" id="sz-40" /><span>40 oz</span></label>
        </div>
      </div>

      <div class="sidebar__section">
        <h3 class="sidebar__section-title">Color</h3>
        <div class="sidebar__colors">
          <button class="color-dot color-dot--active" style="background:#1e293b" aria-label="Negro" data-color="black"></button>
          <button class="color-dot" style="background:#f1f1f1;border:1px solid var(--outline-variant)" aria-label="Blanco" data-color="white"></button>
          <button class="color-dot" style="background:var(--secondary-container)" aria-label="Naranja" data-color="orange"></button>
          <button class="color-dot" style="background:var(--tertiary-container)" aria-label="Azul Marino" data-color="navy"></button>
        </div>
      </div>

      <button class="btn-apply">Aplicar Filtros</button>
    </aside>

    <!-- ── Main ── -->
    <main class="catalog-main page-transition">
      <!-- Breadcrumb -->
      <nav class="breadcrumb">
        <a href="../index.html" class="breadcrumb__link">Inicio</a>
        <span class="material-symbols-outlined" style="font-size:16px">chevron_right</span>
        <span class="breadcrumb__current">Todos los Termos</span>
      </nav>

      <!-- Page Header -->
      <div class="catalog-head">
        <div>
          <h1 class="catalog-head__title">Todos los Termos</h1>
          <p class="catalog-head__sub">Diseñado para el profesional exigente. Hidratación duradera.</p>
        </div>
        <div class="catalog-head__sort">
          <span class="catalog-head__sort-label">Ordenar por:</span>
          <select id="sort-select" class="catalog-head__sort-select">
            <option value="featured">Destacados</option>
            <option value="price-asc">Precio: de menor a mayor</option>
            <option value="price-desc">Precio: de mayor a menor</option>
            <option value="newest">Novedades</option>
          </select>
        </div>
      </div>

      <!-- Product Grid -->
      <div class="products-grid-cat" id="catalog-grid"></div>

      <!-- Load More -->
      <div class="load-more">
        <button class="btn-load-more" id="load-more-btn">Cargar Más Productos</button>
      </div>
    </main>
  </div>

  <div id="app-footer"></div>

  <script src="../js/app.js"></script>
  <script src="../js/catalog.js"></script>
</body>
</html>
